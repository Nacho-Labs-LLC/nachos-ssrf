[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nachos-ssrf"
version = "0.1.0"
description = "SSRF protection with DNS rebinding defense and IPv4-mapped IPv6 coverage"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
